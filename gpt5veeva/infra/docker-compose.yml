version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: veeva
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  parser:
    build: ../services/parser
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ../services/parser:/app
    ports:
      - "8000:8000"
  web:
    build: ../apps/web
    command: pnpm dev
    working_dir: /app
    volumes:
      - ../:/app
    ports:
      - "3000:3000"
volumes:
  db_data: