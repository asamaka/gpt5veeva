name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Enable corepack
        run: corepack enable
      - name: Use pnpm
        run: corepack prepare pnpm@9.0.0 --activate
      - name: Install deps
        run: pnpm install --frozen-lockfile=false

  typecheck:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -w typecheck

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile=false
      - run: echo "TODO: add eslint" && exit 0

  unit:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r --filter './packages/*' test -- --run

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "Integration tests placeholder" && exit 0

  playwright:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: echo "Playwright e2e placeholder" && exit 0

  templates:
    runs-on: ubuntu-latest
    needs: playwright
    steps:
      - uses: actions/checkout@v4
      - run: echo "Template snapshot tests placeholder" && exit 0

  build:
    runs-on: ubuntu-latest
    needs: templates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r build

  artifacts:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: echo "Export sample PDFs placeholder" && exit 0

  update-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile=false
      - run: node scripts/update-qa-scorecard.js
      - name: Commit QA scorecard update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add QA_SCORECARD.md
          git commit -m "ci: update QA scorecard" || echo "No changes"
          git push